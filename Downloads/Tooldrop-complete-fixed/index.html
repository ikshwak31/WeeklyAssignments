<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ToolDrop — Discover the best AI tools before everyone else. Curated, reviewed, and ranked across 500+ tools in 48 categories."/>
    <meta name="theme-color" content="#080b12" />
    <link rel="canonical" href="https://thetooldrop.pages.dev/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ToolDrop — Discover the Best AI Tools" />
    <meta property="og:description" content="Curated, reviewed, and ranked AI tools across 500+ tools in 48 categories. Find the perfect AI tool before everyone else." />
    <meta property="og:url" content="https://thetooldrop.pages.dev/" />
    <meta property="og:site_name" content="ToolDrop" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ToolDrop — Discover the Best AI Tools" />
    <meta name="twitter:description" content="Curated, reviewed, and ranked AI tools across 500+ tools in 48 categories. Find the perfect AI tool before everyone else." />

    <!-- Structured Data: WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "ToolDrop",
      "url": "https://thetooldrop.pages.dev/",
      "description": "Discover the best AI tools before everyone else. Curated, reviewed, and ranked.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://thetooldrop.pages.dev/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Structured Data: ItemList (Top AI Tools) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ItemList",
      "name": "Best AI Tools 2026",
      "description": "Curated list of the best AI tools across all categories",
      "numberOfItems": 78,
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "Cursor", "url": "https://cursor.sh" },
        { "@type": "ListItem", "position": 2, "name": "ChatGPT", "url": "https://chat.openai.com" },
        { "@type": "ListItem", "position": 3, "name": "Claude", "url": "https://claude.ai" },
        { "@type": "ListItem", "position": 4, "name": "Midjourney", "url": "https://midjourney.com" },
        { "@type": "ListItem", "position": 5, "name": "ElevenLabs", "url": "https://elevenlabs.io" },
        { "@type": "ListItem", "position": 6, "name": "Runway ML", "url": "https://runwayml.com" },
        { "@type": "ListItem", "position": 7, "name": "Canva AI", "url": "https://canva.com" },
        { "@type": "ListItem", "position": 8, "name": "Suno", "url": "https://suno.com" },
        { "@type": "ListItem", "position": 9, "name": "Perplexity AI", "url": "https://perplexity.ai" },
        { "@type": "ListItem", "position": 10, "name": "Jasper AI", "url": "https://jasper.ai" }
      ]
    }
    </script>

    <title>ToolDrop — Discover the Best AI Tools</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
